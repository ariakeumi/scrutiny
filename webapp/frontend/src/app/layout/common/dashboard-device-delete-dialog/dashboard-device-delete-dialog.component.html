<h2 mat-dialog-title>删除 {{ data.title }}？</h2>
<mat-dialog-content>该设备及其全部历史数据将从 Scrutiny 中移除。<strong>设备本身的数据不会受到任何影响。</strong></mat-dialog-content>
<mat-dialog-actions>
    <button mat-button mat-dialog-close>取消</button>
    <!-- The mat-dialog-close directive optionally accepts a value as a result for the dialog. -->
    <button class="red-600" mat-button (click)="onDeleteClick()">
        <mat-icon class="icon-size-20 mr-3" [svgIcon]="'delete_forever'"></mat-icon>
        删除
    </button>
</mat-dialog-actions>
