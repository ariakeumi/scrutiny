<div class="flex flex-col items-center justify-center w-full h-full cool-gray-900">
    <div class="flex flex-col items-center max-w-lg rich-text">
        <img class="w-20" src="assets/images/logo/scrutiny-logo-white.svg" />
        <h2>欢迎页模块</h2>
        <p>
            这可以是应用的落地页或欢迎页。如果你配置了 SSR（服务端渲染），或者不需要搜索引擎可见性与优化，也可以把它作为应用的主落地页。
        </p>
        <p>
            这是一个独立的“模块”，拥有自己的目录和路由配置，与实际应用完全分离。这也是多应用配置的一个简单示例：可以有不同的入口点，从而在同一代码库中承载不同的应用。
        </p>
        <a class="mt-10 no-underline" mat-raised-button [color]="'primary'" [routerLink]="'/apps/analytics-dashboard'"> 进入应用 </a>
    </div>
</div>
